services:
  - type: web
    name: lotto-lab
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: lotto-lab-data
      mountPath: /api/health
      sizeGB: 1
    envVars:
      - key: LOTTO_PERSISTENT_DATA_DIR
        value: /api/health
      - key: HOST
        value: 0.0.0.0
      - key: OMP_NUM_THREADS
        value: 1
      - key: OPENBLAS_NUM_THREADS
        value: 1
      - key: MKL_NUM_THREADS
        value: 1
      - key: NUMEXPR_NUM_THREADS
        value: 1
