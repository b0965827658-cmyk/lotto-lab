services:
  - type: web
    name: lotto-lab
    runtime: docker
    rootDir: lotto-lab-web
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: lotto-lab-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: LOTTO_PERSISTENT_DATA_DIR
        value: /var/data
      - key: HOST
        value: 0.0.0.0
